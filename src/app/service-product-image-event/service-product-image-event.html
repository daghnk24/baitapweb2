<div *ngFor="let catalog of catalogs">
    <table border="1">
        <tr>
            <td style="width: 170px;">Ma Danh Muc</td>
            <td>Ten Danh Muc</td>
        </tr>
        <tr>
            <td>{{ catalog.Cateid }}</td>
            <td>{{ catalog.CateName }}</td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <td>Ma San Pham</td>
            <td>Ten San Pham</td>
            <td>Gia San Pham</td>
            <td>Picture</td>
            <td>#</td>
        </tr>

        <tr *ngFor="let p of catalog.Products">
            <td>{{ p.ProductId }}</td>
            <td>{{ p.ProductName }}</td>
            <td>{{ p.Price }}</td>
            <td><img [src]="p.Image" width="50" height="50" /></td>
            <td>
                <a href="javascript:void(0)" (click)="viewDetail(p)">Details</a>
            </td>
        </tr>
    </table>
</div>
