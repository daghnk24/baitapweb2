<div class="catalog-page">
  <div class="top-header">
    <div>098773061</div>
    <div>Trang 15/123</div>
    <div class="link-text">https://tranduythanh.com/</div>
  </div>

  <div class="banner">
    <div class="school-info">
      <div class="school-logo">Đ</div>
      <div class="school-text">
        <span>Đại Học Quốc Gia TP.HCM</span><br>
        <span>Đại Học Kinh Tế Luật</span>
      </div>
    </div>

    <div class="title-block">
      <div>Khoa Hệ Thống Thông Tin</div>
      <strong>Phát triển Web Kinh Doanh Nâng Cao</strong>
    </div>
  </div>

  <div class="catalog-wrapper">
    <div class="catalog-item" *ngFor="let catalog of catalogs">
      <div class="catalog-name">{{ catalog.CateName }}</div>

      <table class="product-table">
        <thead>
          <tr>
            <th>Ma Danh Muc</th>
            <th>Ten Danh Muc</th>
            <th>Gia San Pham</th>
            <th>Picture</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let product of catalog.Products">
            <td>{{ product.ProductId }}</td>
            <td>{{ product.ProductName }}</td>
            <td>{{ product.Price }}</td>
            <td><img [src]="product.Image" [alt]="product.ProductName"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
